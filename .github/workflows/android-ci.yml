name: Build SQL AI APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup stable signing keystore
        env:
          KS_B64: ${{ secrets.SQLAI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/sqlai-release.jks"
            {
              echo "SQLAI_KEYSTORE_FILE=$RUNNER_TEMP/sqlai-release.jks"
              echo "SQLAI_KEYSTORE_PASSWORD=${{ secrets.SQLAI_KEYSTORE_PASSWORD }}"
              echo "SQLAI_KEY_ALIAS=${{ secrets.SQLAI_KEY_ALIAS }}"
              echo "SQLAI_KEY_PASSWORD=${{ secrets.SQLAI_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Stable keystore installed - all builds share one signature"
          else
            echo "No keystore secret - falling back to debug key (upgrades may fail)"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SQL-AI-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/SQL-AI-latest.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQL-AI-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
